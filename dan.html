<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquarium Water Change</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0e153a, #1a2b5e);
            color: #e5e7eb;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .input-style {
            background: #2c3a59;
            color: #f3f4f6;
            border: 1px solid #3b82f6;
            border-radius: 0.375rem;
            padding: 0.75rem;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .input-style:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
            outline: none;
        }
        .button-glow {
            background: #3b82f6;
            color: #ffffff;
            border-radius: 0.375rem;
            font-weight: bold;
            padding: 0.75rem;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }
        .button-glow:hover {
            background: #2563eb;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.6);
        }
        .water-circle {
            width: 250px;
            height: 250px;
            background: rgba(59, 130, 246, 0.2);
            border: 8px solid #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .settings-panel {
            background: rgba(43, 50, 77, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.375rem;
            padding: 1rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            color: #e5e7eb;
        }
        @media (max-width: 768px) {
            .water-circle {
                width: 200px;
                height: 200px;
            }
        }
    </style>
</head>
<body class="flex flex-col h-screen">
    <!-- Setup Page -->
    <div id="setup-page" class="flex-1 flex flex-col p-4 max-w-md w-full mx-auto page-transition">
        <h1 class="text-2xl font-bold text-center mb-8 text-blue-400">Welcome to Aquarium Manager</h1>
        
        <div class="flex-1 flex flex-col justify-center space-y-6">
            <div class="text-center mb-8">
                <p class="text-gray-300 mb-4">Let's set up your aquarium details</p>
            </div>

            <div class="flex flex-col">
                <label class="text-sm text-gray-400 mb-1">Aquarium Size (Liters)</label>
                <input type="number" id="setup-total-volume" 
                    class="input-style w-full p-3 rounded-lg text-white text-center text-lg"
                    placeholder="Enter aquarium size">
            </div>

            <div class="flex flex-col">
                <label class="text-sm text-gray-400 mb-1">Bucket Size (Liters)</label>
                <input type="number" id="setup-bucket-size" 
                    class="input-style w-full p-3 rounded-lg text-white text-center text-lg"
                    placeholder="Enter bucket size">
            </div>

            <div class="flex flex-col">
                <label class="text-sm text-gray-400 mb-1">Daily Water Degradation (%)</label>
                <input type="number" id="setup-degradation-rate" 
                    class="input-style w-full p-3 rounded-lg text-white text-center text-lg"
                    placeholder="Daily degradation rate"
                    step="0.1">
            </div>

            <button id="complete-setup" 
                class="button-glow w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 px-4 rounded-lg transition-all duration-300 mt-8">
                Start Using App
            </button>
        </div>
    </div>

    <!-- Main App Page -->
    <div id="main-page" class="hidden flex-1 flex flex-col p-4 max-w-md w-full mx-auto page-transition">
        <!-- Settings Button -->
        <div class="absolute top-4 right-4">
            <button id="settings-button" 
                class="p-2 rounded-full bg-gray-700 hover:bg-gray-600 transition-all duration-300">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>
        </div>

        <h1 class="text-xl font-bold text-center mb-2 text-blue-400">Aquarium Water Change</h1>
        
        <div class="flex-1 flex flex-col justify-between">
            <div class="flex-1 flex items-center justify-center mb-4">
                <div class="water-circle w-64 h-64 rounded-full flex items-center justify-center bg-red-500 bg-opacity-20 border-4 border-red-400">
                    <h2 class="text-6xl font-bold" id="percentage">100%</h2>
                </div>
            </div>

            <div class="space-y-3">
                <div id="current-settings" class="text-center mb-4 text-gray-400">
                    <p>Aquarium: <span id="current-volume">0</span>L</p>
                    <p>Bucket: <span id="current-bucket">0</span>L</p>
                    <p>Daily Degradation: <span id="current-degradation">0</span>%</p>
                    <p class="text-sm mt-2">Last Updated: <span id="last-update">Never</span></p>
                </div>

                <button id="take-bucket" 
                    class="button-glow w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-lg transition-all duration-300">
                    Replace Dirty Water
                </button>

                <button id="reset-button" 
                    class="w-full bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg transition-all duration-300 mb-4">
                    Reset to 100%
                </button>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const setupPage = document.getElementById('setup-page');
        const mainPage = document.getElementById('main-page');
        const setupTotalVolume = document.getElementById('setup-total-volume');
        const setupBucketSize = document.getElementById('setup-bucket-size');
        const setupDegradationRate = document.getElementById('setup-degradation-rate');
        const completeSetupButton = document.getElementById('complete-setup');
        const settingsButton = document.getElementById('settings-button');
        const percentageElement = document.getElementById('percentage');
        const takeBucketButton = document.getElementById('take-bucket');
        const resetButton = document.getElementById('reset-button');
        const waterCircle = document.querySelector('.water-circle');
        const currentVolumeSpan = document.getElementById('current-volume');
        const currentBucketSpan = document.getElementById('current-bucket');
        const currentDegradationSpan = document.getElementById('current-degradation');
        const lastUpdateSpan = document.getElementById('last-update');

        // State
        let dirtyPercentage = parseFloat(localStorage.getItem('dirtyPercentage')) || 100;
        let totalVolume = parseInt(localStorage.getItem('totalVolume')) || 0;
        let bucketSize = parseInt(localStorage.getItem('bucketSize')) || 0;
        let degradationRate = parseFloat(localStorage.getItem('degradationRate')) || 3.0;
        let lastUpdate = localStorage.getItem('lastUpdate') || new Date().toISOString();
        let isSetup = localStorage.getItem('isSetup') === 'true';

        function showPage(pageId) {
            if (pageId === 'setup') {
                setupPage.classList.remove('hidden');
                mainPage.classList.add('hidden');
            } else {
                setupPage.classList.add('hidden');
                mainPage.classList.remove('hidden');
            }
        }

        function updateDegradation() {
            const now = new Date();
            const lastUpdateDate = new Date(lastUpdate);
            const daysDiff = (now - lastUpdateDate) / (1000 * 60 * 60 * 24);
            
            if (daysDiff > 0) {
                const additionalDirty = daysDiff * degradationRate;
                dirtyPercentage = Math.min(100, dirtyPercentage + additionalDirty);
                lastUpdate = now.toISOString();
                updateDisplay();
            }
        }

        function formatLastUpdate() {
            const date = new Date(lastUpdate);
            return date.toLocaleString();
        }

        function updateDisplay() {
            percentageElement.textContent = `${dirtyPercentage.toFixed(1)}%`;
            currentVolumeSpan.textContent = totalVolume;
            currentBucketSpan.textContent = bucketSize;
            currentDegradationSpan.textContent = degradationRate;
            lastUpdateSpan.textContent = formatLastUpdate();
            
            const hue = Math.max(0, 200 - (dirtyPercentage * 2));
            waterCircle.style.borderColor = `hsl(${hue}, 70%, 60%)`;
            waterCircle.style.backgroundColor = `hsla(${hue}, 70%, 60%, 0.2)`;

            localStorage.setItem('dirtyPercentage', dirtyPercentage.toString());
            localStorage.setItem('totalVolume', totalVolume.toString());
            localStorage.setItem('bucketSize', bucketSize.toString());
            localStorage.setItem('degradationRate', degradationRate.toString());
            localStorage.setItem('lastUpdate', lastUpdate);
            localStorage.setItem('isSetup', 'true');
        }

        completeSetupButton.addEventListener('click', () => {
            const newTotal = parseInt(setupTotalVolume.value);
            const newBucket = parseInt(setupBucketSize.value);
            const newDegradation = parseFloat(setupDegradationRate.value);
            
            if (isNaN(newTotal) || newTotal <= 0) {
                alert('Please enter a valid aquarium size');
                return;
            }
            if (isNaN(newBucket) || newBucket <= 0) {
                alert('Please enter a valid bucket size');
                return;
            }
            if (newBucket > newTotal) {
                alert('Bucket size cannot be larger than aquarium!');
                return;
            }
            if (isNaN(newDegradation) || newDegradation < 0 || newDegradation > 100) {
                alert('Please enter a valid degradation rate (0-100)');
                return;
            }

            totalVolume = newTotal;
            bucketSize = newBucket;
            degradationRate = newDegradation;
            dirtyPercentage = 100;
            lastUpdate = new Date().toISOString();
            isSetup = true;
            
            updateDisplay();
            showPage('main');
        });

        takeBucketButton.addEventListener('click', () => {
            updateDegradation(); // Update before calculating new percentage
            const percentageDecrease = (bucketSize / totalVolume) * 100;
            dirtyPercentage -= percentageDecrease;
            
            if (dirtyPercentage < 0) dirtyPercentage = 0;
            lastUpdate = new Date().toISOString();
            
            updateDisplay();

            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
        });

        resetButton.addEventListener('click', () => {
            dirtyPercentage = 100;
            lastUpdate = new Date().toISOString();
            updateDisplay();

            if (navigator.vibrate) {
                navigator.vibrate([50, 50, 50]);
            }
        });

        settingsButton.addEventListener('click', () => {
            setupTotalVolume.value = totalVolume;
            setupBucketSize.value = bucketSize;
            setupDegradationRate.value = degradationRate;
            showPage('setup');
        });

        // Initialize app
        if (!isSetup) {
            setupDegradationRate.value = degradationRate;
            showPage('setup');
        } else {
            showPage('main');
            updateDegradation(); // Check for updates on load
            updateDisplay();
        }

        // Check for updates every minute
        setInterval(updateDegradation, 60000);

        // Add to home screen prompt
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });
    </script>
</body>
</html>
